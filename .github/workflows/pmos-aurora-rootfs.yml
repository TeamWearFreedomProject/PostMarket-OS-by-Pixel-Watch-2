# Offline-only postmarketOS userspace experiment for Pixel Watch 2 (aurora).
# This workflow NEVER flashes a watch, writes partitions or alters AsteroidOS.
# No aurora kernel/boot images exist; the output, if built, is NOT bootable.
name: pmOS aurora userspace archive experiment

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/pmos-aurora-rootfs.yml"

permissions:
  contents: read

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install pmbootstrap requirements
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 openssl coreutils procps tar xz-utils \
            kpartx util-linux qemu-user-static binfmt-support
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          mkdir -p "$HOME/.local/bin"
          ln -s /tmp/pmbootstrap/pmbootstrap.py "$HOME/.local/bin/pmbootstrap"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Initialize host and select experimental aurora device
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          python3 -c 'print("\n" * 150)' > "$RUNNER_TEMP/pmbootstrap-answers"
          timeout 720 pmbootstrap -y init < "$RUNNER_TEMP/pmbootstrap-answers"
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          install -d "$PMAPORTS/device/testing/device-google-aurora"
          cp -a port/device/testing/device-google-aurora/. "$PMAPORTS/device/testing/device-google-aurora/"
          grep -qx 'deviceinfo_flash_method="none"' "$PMAPORTS/device/testing/device-google-aurora/deviceinfo"
          pmbootstrap config device google-aurora
          test "$(pmbootstrap config device)" = google-aurora
          pmbootstrap status
          df -h /

      - name: Attempt AArch64 aurora userspace install without an image
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p out
          # Package and OS userspace install normally finish before mkinitfs.
          # Since there is intentionally NO aurora Linux kernel package yet,
          # mkinitfs fails with "kernel release/flavor ... found: []".
          # Accept ONLY this exact expected error for a userspace-only archive.
          # Never claim pmbootstrap install or a bootable OS succeeded.
          set +e
          timeout 3600 pmbootstrap -y --no-cross install \
              --no-image --no-sshd --no-firewall --password=CI_PUBLIC_TEST_ONLY
          RC=$?
          set -e
          LOG="$HOME/.local/var/pmbootstrap/log.txt"
          if [ "$RC" -ne 0 ]; then
            if [ "$RC" -eq 124 ] || ! grep -Fq 'only one kernel release/flavor is supported, found: []' "$LOG"; then
              echo "Unexpected rootfs error (exit $RC); not producing userspace archive." >> "$GITHUB_STEP_SUMMARY"
              tail -n 220 "$LOG" || true
              exit 1
            fi
            echo "### Expected incomplete-install state" >> "$GITHUB_STEP_SUMMARY"
            echo "mkinitfs cannot run until a matching aurora kernel package is installed." >> "$GITHUB_STEP_SUMMARY"
            echo "Only the pre-mkinitfs userspace is being archived." >> "$GITHUB_STEP_SUMMARY"
          fi
          WORK="$(pmbootstrap config work)"
          ROOTFS="$WORK/chroot_rootfs_google-aurora"
          test -s "$ROOTFS/etc/os-release"
          test -s "$ROOTFS/lib/apk/db/installed"
          grep -qx 'aarch64' "$ROOTFS/etc/apk/arch"
          grep -qx 'P:device-google-aurora' "$ROOTFS/lib/apk/db/installed"
          grep -E '^(NAME|VERSION|ID)=' "$ROOTFS/etc/os-release"
          # Archive is a public CI artifact, not a production installation.
          # Lock all passwords so no published test password can be used later.
          if [ -f "$ROOTFS/etc/shadow" ]; then
            sudo sed -i -E 's/^([^:]+):[^:]*:/\1:!:/' "$ROOTFS/etc/shadow"
          fi
          if [ -d "$ROOTFS/etc/ssh" ]; then
            sudo find "$ROOTFS/etc/ssh" -type f -name 'ssh_host_*_key*' -delete
          fi
          sudo find "$ROOTFS" -xdev -type f -printf '%P\n' | sort > out/aurora-rootfs-file-manifest.txt
          echo "Verified aarch64 userspace and installed aurora metadata package." >> "$GITHUB_STEP_SUMMARY"
          echo "No kernel, initramfs, boot image, or verified install procedure exists." >> "$GITHUB_STEP_SUMMARY"
          # Exclude host-mounted virtual filesystems and temporary directories.
          sudo tar -C "$ROOTFS" --one-file-system --numeric-owner \
            --exclude='./dev' --exclude='./proc' --exclude='./sys' \
            --exclude='./run' --exclude='./tmp' -cf - . \
            | xz -T2 -1 > out/aurora-pmos-PARTIAL-userspace-DO-NOT-FLASH.tar.xz
          sha256sum out/aurora-pmos-PARTIAL-userspace-DO-NOT-FLASH.tar.xz > out/SHA256SUMS
          xz -t out/aurora-pmos-PARTIAL-userspace-DO-NOT-FLASH.tar.xz
          du -h out/*

      - name: Save diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p out
          cp "$HOME/.local/var/pmbootstrap/log.txt" out/pmbootstrap.log 2>/dev/null || true
          df -h / > out/runner-disk.txt
          echo "### Safety" >> "$GITHUB_STEP_SUMMARY"
          echo "No device connected, no flashing, and no changes to AsteroidOS." >> "$GITHUB_STEP_SUMMARY"
          echo "All outputs are experimental, NOT usable boot/flash images." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload experiment artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-pmos-userspace-EXPERIMENTAL-DO-NOT-FLASH
          path: out/
          retention-days: 7
          if-no-files-found: error
