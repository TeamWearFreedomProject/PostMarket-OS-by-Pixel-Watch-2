# First milestone: verify postmarketOS tooling on GitHub-hosted Linux.
# This workflow never connects to or flashes the Pixel Watch 2.
# A successful run proves pmbootstrap can run and produce an AArch64 test package,
# NOT that aurora has a functional/bootable postmarketOS image.
name: pmOS AArch64 build test

on:
  push:
    paths:
      - ".github/workflows/pmos-bootstrap.yml"
      - "port/device/testing/device-google-aurora/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pmbootstrap-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Inspect runner resources
        run: |
          set -eu
          uname -a
          git --version
          python3 --version
          df -h /
          free -h

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git python3 openssl coreutils procps tar xz-utils \
            kpartx util-linux qemu-user-static binfmt-support

      - name: Install current upstream pmbootstrap
        run: |
          set -eu
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git /tmp/pmbootstrap
          mkdir -p "$HOME/.local/bin"
          ln -s /tmp/pmbootstrap/pmbootstrap.py "$HOME/.local/bin/pmbootstrap"
          "$HOME/.local/bin/pmbootstrap" --version

      - name: Initialize a disposable pmbootstrap workspace
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # Feed blank answers for default settings. This first run is a
          # generic pmbootstrap smoke test, not a Pixel Watch 2 device port.
          python3 -c 'print("\n" * 150)' > "$RUNNER_TEMP/pmbootstrap-answers"
          timeout 720 pmbootstrap -y init < "$RUNNER_TEMP/pmbootstrap-answers"
          pmbootstrap status

      - name: Build example Alpine package for AArch64
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          if ! timeout 2100 pmbootstrap -y --no-cross build --arch=aarch64 hello-world --force; then
            echo '--- pmbootstrap internal build log (last 180 lines) ---'
            tail -n 180 "$HOME/.local/var/pmbootstrap/log.txt" || true
            exit 1
          fi
          echo "pmbootstrap AArch64 hello-world package build succeeded." >> "$GITHUB_STEP_SUMMARY"

      - name: Build experimental google-aurora metadata package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          PMAPORTS="$HOME/.local/var/pmbootstrap/cache_git/pmaports"
          TEST_PKG="$PMAPORTS/device/testing/device-google-aurora"
          install -d "$TEST_PKG"
          cp -a port/device/testing/device-google-aurora/. "$TEST_PKG/"
          echo "Staged metadata-only package; flash_method is disabled:"
          grep '^deviceinfo_flash_method=' "$TEST_PKG/deviceinfo"
          if ! timeout 2100 pmbootstrap -y --no-cross build --arch=aarch64 device-google-aurora --force; then
            echo '--- pmbootstrap aurora package build error log (last 200 lines) ---'
            tail -n 200 "$HOME/.local/var/pmbootstrap/log.txt" || true
            exit 1
          fi
          echo "Experimental device-google-aurora metadata APK built for AArch64." >> "$GITHUB_STEP_SUMMARY"
          echo "IMPORTANT: No kernel package, rootfs or boot image has been produced." >> "$GITHUB_STEP_SUMMARY"

      - name: Runner disk usage / next steps
        if: always()
        run: |
          echo "### Scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI-only tooling and AArch64 example package" >> "$GITHUB_STEP_SUMMARY"
          echo "- The aurora device package (when built) is metadata ONLY, not a bootable image" >> "$GITHUB_STEP_SUMMARY"
          echo "- No flash, partition changes, or watch communication" >> "$GITHUB_STEP_SUMMARY"
          df -h / >> "$GITHUB_STEP_SUMMARY"
